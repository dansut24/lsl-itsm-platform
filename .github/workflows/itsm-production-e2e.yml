name: Hi5Central Production ITSM E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  production-itsm-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hi5central
          POSTGRES_USER: hi5central
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hi5central -d hi5central"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate workflow and notification contract
        run: node scripts/check-itsm-end-to-end.mjs
      - name: Install API dependencies
        working-directory: api
        run: npm install --omit=dev
      - name: Parse production ITSM sources
        working-directory: api
        run: |
          node --check src/itsmRecords.js
          node --check src/itsmLifecycle.js
          node --check src/itsmActions.js
          node --check src/itsmQueue.js
          node --check src/serviceRequests.js
          node --check src/serviceRequestOperations.js
          node --check src/itsmWorkflows.js
          node --check src/notifications.js
          node --check src/notificationMailer.js
          node --check scripts/itsm-production-e2e.mjs
          node --check scripts/itsm-lifecycle-e2e.mjs
          node --check scripts/itsm-workflow-notification-e2e.mjs
      - name: Run database migrations
        working-directory: api
        env:
          DATABASE_URL: postgresql://hi5central:test-password@127.0.0.1:5432/hi5central
        run: npm run migrate
      - name: Boot API and run production ITSM E2E
        working-directory: api
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://hi5central:test-password@127.0.0.1:5432/hi5central
          REDIS_URL: redis://127.0.0.1:6379/0
          API_URL: http://127.0.0.1:3001
          MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          npm start > /tmp/hi5central-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health
          echo

          RESULT=0
          node scripts/itsm-production-e2e.mjs || RESULT=$?
          if [ "$RESULT" -eq 0 ]; then
            node scripts/itsm-lifecycle-e2e.mjs || RESULT=$?
          fi
          if [ "$RESULT" -eq 0 ]; then
            node scripts/itsm-workflow-notification-e2e.mjs || RESULT=$?
          fi

          if [ "$RESULT" -ne 0 ]; then
            cat /tmp/hi5central-api.log
            exit "$RESULT"
          fi
