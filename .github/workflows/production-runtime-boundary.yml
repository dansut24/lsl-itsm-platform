name: Production Runtime Boundary

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-runtime-boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify production runtime boundary
        run: npm run check:production-runtime

      - name: Build production web
        run: npm run build
