name: Publish Record Workspace Task CI Fix

on:
  push:
    branches: [record-workspace-lab]

permissions:
  contents: write

jobs:
  publish-task-ci-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: record-workspace-lab
          fetch-depth: 0

      - name: Download verified VPS patch
        run: |
          curl -fsSL https://recordlab.hi5central.com/record-workspace-task-ci-fix.patch -o /tmp/record-workspace-task-ci-fix.patch
          echo 'bfb61c166a284f75be63694bb25ea72d66d0fe0ed2894e3652a2c910e6a80cfd  /tmp/record-workspace-task-ci-fix.patch' | sha256sum -c -

      - name: Apply exact task compatibility fix
        run: |
          git apply --index /tmp/record-workspace-task-ci-fix.patch
          git diff --cached --check
          node scripts/check-task-layout-contract.mjs
          node scripts/check-task-ownership-contract.mjs

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit final fix and remove one-shot workflow
        run: |
          git config user.name 'Hi5Central Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/publish-record-workspace-task-ci-fix.yml
          git commit -m 'Align Task workspace with ownership and layout contracts'
          git push origin HEAD:record-workspace-lab
