name: Temporary task ownership server guard

on:
  push:
    branches: [task-take-release-workflow]
    paths:
      - .github/workflows/_temp-task-ownership-server-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-take-release-workflow
      - name: Enforce current-owner task work
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('api/src/serviceRequestState.js')
          text = path.read_text()
          marker = """        if (task.status === 'Completed' && changeStatus && body.status !== 'Completed') {
          const error = new Error('Completed tasks cannot be reopened from the Tasks queue.')
          error.status = 409
          throw error
        }

        const team = changeTeam ? await resolveTaskTeam(client, auth.session.tenant_id, body.teamId ?? body.team) : null
"""
          replacement = """        if (task.status === 'Completed' && changeStatus && body.status !== 'Completed') {
          const error = new Error('Completed tasks cannot be reopened from the Tasks queue.')
          error.status = 409
          throw error
        }

        const actor = await actorSnapshot(client, auth.session)
        if ((changeStatus || changeCompletion) && (!actor.person?.id || task.assignee_person_id !== actor.person.id)) {
          const error = new Error('Take this task before starting, blocking or completing work.')
          error.status = 409
          throw error
        }

        const team = changeTeam ? await resolveTaskTeam(client, auth.session.tenant_id, body.teamId ?? body.team) : null
"""
          if marker not in text:
              raise SystemExit('Task work guard insertion point not found')
          text = text.replace(marker, replacement, 1)
          duplicate = """        const actor = await actorSnapshot(client, auth.session)
        await client.query(
"""
          if text.count(duplicate) != 1:
              raise SystemExit('Expected later actor declaration not found exactly once')
          text = text.replace(duplicate, """        await client.query(
""", 1)
          path.write_text(text)
          PY
          node --check api/src/serviceRequestState.js
          node --check api/src/taskOwnership.js
      - name: Commit server guard
        shell: bash
        run: |
          git config user.name "Hi5Central CI"
          git config user.email "actions@hi5central.com"
          git add api/src/serviceRequestState.js
          git commit -m "Require task ownership before fulfilment work"
          git push origin HEAD:task-take-release-workflow
