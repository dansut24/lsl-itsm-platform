name: Publish Record Workspace

on:
  push:
    branches: [record-workspace-lab]

permissions:
  contents: write

jobs:
  publish-final-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4
        with:
          ref: record-workspace-lab
          fetch-depth: 0

      - name: Download verified VPS patch
        run: |
          curl -fsSL https://recordlab.hi5central.com/record-workspace-production.patch -o /tmp/record-workspace-production.patch
          echo 'bde2bee0389821b5afda9d7b8f7e3fa36abc703f76f93764e84f78e9aed53b08  /tmp/record-workspace-production.patch' | sha256sum -c -

      - name: Apply final source
        run: |
          git apply --index /tmp/record-workspace-production.patch
          git diff --cached --check

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit exact final tree
        run: |
          git config user.name 'Hi5Central Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/publish-record-workspace.yml
          git commit -m 'Complete reusable work item workspace'
          git push origin HEAD:record-workspace-lab
