name: Deployment portability

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check deployment portability
        run: npm run check:deployment
