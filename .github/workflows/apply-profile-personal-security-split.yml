name: Apply profile personal security split

on:
  push:
    branches:
      - profile-personal-security
    paths:
      - scripts/apply-profile-personal-security-split.mjs
      - .github/workflows/apply-profile-personal-security-split.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-personal-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply security ownership split
        run: node scripts/apply-profile-personal-security-split.mjs
      - name: Install web dependencies
        run: npm ci
      - name: Check production runtime boundary
        run: npm run check:production-runtime
      - name: Check Profile and Settings contract
        run: node scripts/check-profile-settings-contract.mjs
      - name: Build production web
        run: npm run build
      - name: Parse changed API security source
        run: node --check api/src/security.js
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/production/ProductionProfileWorkspace.jsx src/features/settings/ProductionSettingsWorkspace.jsx api/src/security.js scripts/check-profile-settings-contract.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Separate personal security from tenant Settings"
            git push origin HEAD:profile-personal-security
          fi
