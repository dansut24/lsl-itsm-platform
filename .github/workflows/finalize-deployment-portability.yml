name: Finalize deployment portability

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-deployment-portability.mjs'
      - '.github/workflows/finalize-deployment-portability.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply deterministic portability cleanup
        run: node scripts/finalize-deployment-portability.mjs
      - name: Validate API syntax before commit
        run: |
          for file in api/src/*.js; do
            node --check "$file"
          done
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No cleanup required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src src
          git commit -m 'Complete deployment portability cleanup'
          git push origin HEAD:main
