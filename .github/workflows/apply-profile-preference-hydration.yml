name: Apply profile preference hydration

on:
  push:
    branches:
      - profile-settings-unification
    paths:
      - scripts/apply-profile-preference-hydration.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-settings-unification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-profile-preference-hydration.mjs
      - run: npm ci
      - run: npm run check:production-runtime
      - run: node scripts/check-profile-settings-contract.mjs
      - run: npm run build
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/session.js src/production/ProductionWorkspaceBootstrap.jsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Hydrate personal workspace preferences from session"
          git push origin HEAD:profile-settings-unification
