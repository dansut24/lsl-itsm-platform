name: Production Runtime Hardening
# retry: corrected JavaScript prototype member detection

on:
  push:
    branches:
      - production-runtime-demo-cleanup
    paths:
      - .github/workflows/production-runtime-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-runtime-demo-cleanup

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Repair finaliser template escaping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalise-production-runtime-cleanup.mjs')
          text = path.read_text()
          old = r"await fetch(\`${API_BASE}/api/v1/auth/logout\`,"
          new = r"await fetch(\`\${API_BASE}/api/v1/auth/logout\`,"
          if old not in text:
              raise SystemExit('Expected API_BASE template fragment not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply final extraction cleanup
        run: node scripts/finalise-production-runtime-cleanup.mjs

      - name: Harden active production runtime
        run: python3 scripts/production-runtime-hardening.py

      - name: Verify production runtime boundary
        run: node scripts/check-production-runtime-boundary.mjs

      - name: Build production web
        run: npm run build

      - name: Publish hardened runtime
        shell: bash
        run: |
          rm -f scripts/finalise-production-runtime-cleanup.mjs
          rm -f scripts/production-runtime-hardening.py
          rm -f scripts/refactor-production-runtime.mjs
          rm -f scripts/normalise-production-runtime.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          git reset -- \
            .github/workflows/production-runtime-finalise.yml \
            .github/workflows/production-runtime-finalise-retry.yml \
            .github/workflows/production-runtime-diagnostics.yml \
            .github/workflows/production-runtime-hardening.yml || true

          if git diff --cached --quiet; then
            echo "No source changes to publish."
            exit 0
          fi

          git commit -m "Harden production runtime and remove simulated state"
          git push origin HEAD:production-runtime-demo-cleanup
