name: Hi5Central CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hi5central
          POSTGRES_USER: hi5central
          POSTGRES_PASSWORD: hi5central-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hi5central -d hi5central"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Install API dependencies
        working-directory: api
        run: npm install --omit=dev

      - name: Parse API source
        working-directory: api
        run: |
          for file in src/*.js; do
            node --check "$file"
          done

      - name: Run database migrations
        working-directory: api
        env:
          DATABASE_URL: postgresql://hi5central:hi5central-ci@127.0.0.1:5432/hi5central
        run: npm run migrate

      - name: Boot API and smoke test
        working-directory: api
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://hi5central:hi5central-ci@127.0.0.1:5432/hi5central
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          npm start > /tmp/hi5central-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true; cat /tmp/hi5central-api.log' EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/live >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3001/live
          echo
          curl -fsS http://127.0.0.1:3001/health
          echo

          ORG_TOKEN='hi5central-ci-organisation-session'
          ORG_TOKEN_HASH="$(printf '%s' "$ORG_TOKEN" | sha256sum | awk '{print $1}')"

          PGPASSWORD=hi5central-ci psql \
            -h 127.0.0.1 \
            -U hi5central \
            -d hi5central \
            -v ON_ERROR_STOP=1 \
            -v token_hash="$ORG_TOKEN_HASH" <<'SQL'
          INSERT INTO tenants (id, slug, company_name, status)
          VALUES ('00000000-0000-4000-8000-000000000101', 'ci-organisation', 'CI Organisation', 'active');

          INSERT INTO users (id, email, name, password_hash, email_verified_at)
          VALUES ('00000000-0000-4000-8000-000000000102', 'ci-organisation@hi5central.test', 'CI Owner', 'unused-ci-hash', now());

          INSERT INTO tenant_memberships (tenant_id, user_id, role, status)
          VALUES (
            '00000000-0000-4000-8000-000000000101',
            '00000000-0000-4000-8000-000000000102',
            'owner',
            'active'
          );

          INSERT INTO tenant_settings (
            tenant_id,
            modules,
            onboarding_step,
            onboarding_completed_at,
            tenant_url,
            portal_url,
            onboarding_data,
            configuration
          )
          VALUES (
            '00000000-0000-4000-8000-000000000101',
            '{"itsm":true,"rmm":false}'::jsonb,
            'complete',
            now(),
            'https://ci-organisation.hi5central.com',
            'https://ci-organisation-portal.hi5central.com',
            '{"groups":{"firstDepartment":"Technology","serviceDeskTeam":"Service Desk","firstSite":"London HQ"},"company":{"timezone":"Europe/London"}}'::jsonb,
            '{"groups":{"firstDepartment":"Technology","serviceDeskTeam":"Service Desk","firstSite":"London HQ"},"company":{"timezone":"Europe/London"},"itsm":{"managerApprovalThreshold":"500"}}'::jsonb
          );

          INSERT INTO auth_sessions (tenant_id, user_id, token_hash, expires_at)
          VALUES (
            '00000000-0000-4000-8000-000000000101',
            '00000000-0000-4000-8000-000000000102',
            :'token_hash',
            now() + interval '1 hour'
          );
          SQL

          ORG_COOKIE="hi5central_session=$ORG_TOKEN"

          curl -fsS \
            -H "Cookie: $ORG_COOKIE" \
            http://127.0.0.1:3001/api/v1/organisation \
            | tee /tmp/organisation.json

          grep -q '"people"' /tmp/organisation.json
          grep -q 'CI Owner' /tmp/organisation.json
          grep -q 'London HQ' /tmp/organisation.json

          curl -fsS \
            -X PUT \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"items":[{"id":"SITE-CI","code":"CI","name":"CI Test Site","type":"Office","city":"London","country":"United Kingdom","timezone":"Europe/London","active":true}]}' \
            http://127.0.0.1:3001/api/v1/organisation/sites \
            | tee /tmp/organisation-put.json

          grep -q 'CI Test Site' /tmp/organisation-put.json

          PGPASSWORD=hi5central-ci psql \
            -h 127.0.0.1 \
            -U hi5central \
            -d hi5central \
            -v ON_ERROR_STOP=1 \
            -c "SELECT external_key, name FROM organisation_sites WHERE tenant_id = '00000000-0000-4000-8000-000000000101'::uuid AND external_key = 'SITE-CI';" \
            | grep -q 'CI Test Site'

          curl -fsS \
            -X PUT \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"categories":["Hardware"],"items":[{"id":"CAT-HW-LAPTOP","title":"CI Laptop","category":"Hardware","description":"CI priced laptop","kind":"product","requestType":"Service Request","service":"Hardware","team":"Service Desk","approval":"manager-cost","approvalThreshold":500,"visibility":"portal","priceMode":"fixed","oneOffPrice":1399,"monthlyPrice":0,"currency":"GBP","workflow":"hardware-fulfilment","formSchema":[],"options":[],"active":true},{"id":"CAT-EQUIPMENT","title":"Request Equipment","category":"Hardware","description":"Request a managed device","kind":"request-form","requestType":"Service Request","service":"Hardware","team":"Service Desk","approval":"manager-cost","approvalThreshold":500,"visibility":"portal","priceMode":"calculated","oneOffPrice":0,"monthlyPrice":0,"currency":"GBP","workflow":"hardware-fulfilment","formSchema":[{"id":"device","label":"Primary item","type":"product","required":true,"options":[{"value":"CI Laptop","label":"Old laptop label","cost":1,"itemId":"CAT-HW-LAPTOP","category":"Hardware"}]},{"id":"businessReason","label":"Business reason","type":"textarea","required":true}],"options":[],"active":true}]}' \
            http://127.0.0.1:3001/api/v1/catalogue \
            | tee /tmp/catalogue.json

          grep -q 'CI Laptop' /tmp/catalogue.json

          curl -fsS \
            http://127.0.0.1:3001/api/v1/portal/catalogue/ci-organisation \
            | tee /tmp/portal-catalogue.json

          grep -q 'Request Equipment' /tmp/portal-catalogue.json
          grep -q '1399' /tmp/portal-catalogue.json
          if grep -q 'Old laptop label' /tmp/portal-catalogue.json; then
            echo 'Portal catalogue did not resolve the live product title.' >&2
            exit 1
          fi

          curl -fsS \
            -X POST \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"catalogueItemId":"CAT-EQUIPMENT","summary":"CI equipment request","urgency":"Medium","fields":{"device":"CI Laptop","businessReason":"Required for CI validation"},"details":{"text":"Created by the CI service-request smoke test."}}' \
            http://127.0.0.1:3001/api/v1/service-requests \
            | tee /tmp/service-request.json

          grep -q 'REQ-00001' /tmp/service-request.json
          grep -q 'CI equipment request' /tmp/service-request.json
          grep -q '"oneOffCost":1399' /tmp/service-request.json
          grep -q 'Pending Approval' /tmp/service-request.json
          grep -q 'CI Laptop' /tmp/service-request.json

          curl -fsS \
            -H "Cookie: $ORG_COOKIE" \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001 \
            | grep -q 'CI equipment request'

          PGPASSWORD=hi5central-ci psql \
            -h 127.0.0.1 \
            -U hi5central \
            -d hi5central \
            -v ON_ERROR_STOP=1 \
            -c "SELECT reference, title, one_off_cost, status FROM service_requests WHERE tenant_id = '00000000-0000-4000-8000-000000000101'::uuid AND reference = 'REQ-00001';" \
            | grep -q '1399.00'

          curl -sS -D /tmp/patch-preflight.headers -o /dev/null \
            -X OPTIONS \
            -H 'Origin: https://ci-organisation.hi5central.com' \
            -H 'Access-Control-Request-Method: PATCH' \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001

          tr -d '\r' < /tmp/patch-preflight.headers | grep -i 'access-control-allow-methods:' | grep -q 'PATCH'

          curl -fsS \
            -X PATCH \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"priority":"High","team":"Service Desk","assignee":"ci-organisation@hi5central.test"}' \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001 \
            | tee /tmp/service-request-assigned.json

          grep -q '"updated":true' /tmp/service-request-assigned.json

          curl -fsS \
            -X POST \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"targetStatus":"Approved","values":{"approvalConfirmation":true,"approvalNote":"CI manager approval confirmed"}}' \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001/transition \
            | tee /tmp/service-request-approved.json

          grep -q '"status":"Approved"' /tmp/service-request-approved.json

          curl -fsS \
            -X POST \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"targetStatus":"In Progress","values":{}}' \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001/transition \
            | tee /tmp/service-request-in-progress.json

          grep -q '"status":"In Progress"' /tmp/service-request-in-progress.json

          curl -fsS \
            -X POST \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"kind":"work","text":"CI internal fulfilment note."}' \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001/activities \
            | tee /tmp/service-request-work-note.json

          grep -q 'CI internal fulfilment note' /tmp/service-request-work-note.json
          grep -q '"visibility":"internal"' /tmp/service-request-work-note.json

          curl -fsS \
            -X POST \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"kind":"customer","text":"CI customer-visible update."}' \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001/activities \
            | tee /tmp/service-request-customer-note.json

          grep -q 'CI customer-visible update' /tmp/service-request-customer-note.json
          grep -q '"visibility":"customer"' /tmp/service-request-customer-note.json

          curl -fsS \
            -X PATCH \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"status":"Completed","assignee":"ci-organisation@hi5central.test","team":"Service Desk","completionNotes":"CI fulfilment task completed."}' \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001/tasks/REQ-00001-FULFIL \
            | tee /tmp/service-request-task.json

          grep -q '"updated":true' /tmp/service-request-task.json

          curl -fsS \
            -X POST \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"targetStatus":"Completed","values":{"completionNotes":"CI request fulfilment completed and verified."}}' \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001/transition \
            | tee /tmp/service-request-completed.json

          grep -q '"status":"Completed"' /tmp/service-request-completed.json

          curl -fsS \
            -X POST \
            -H "Cookie: $ORG_COOKIE" \
            -H 'Content-Type: application/json' \
            --data '{"targetStatus":"Closed","values":{}}' \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001/transition \
            | tee /tmp/service-request-closed.json

          grep -q '"status":"Closed"' /tmp/service-request-closed.json

          curl -fsS \
            -H "Cookie: $ORG_COOKIE" \
            http://127.0.0.1:3001/api/v1/service-request-state/REQ-00001 \
            | tee /tmp/service-request-state.json

          grep -q '"status":"Closed"' /tmp/service-request-state.json
          grep -q '"priority":"High"' /tmp/service-request-state.json
          grep -q '"assignee":"CI Owner"' /tmp/service-request-state.json
          grep -q 'CI request fulfilment completed and verified' /tmp/service-request-state.json

          curl -fsS \
            -H "Cookie: $ORG_COOKIE" \
            http://127.0.0.1:3001/api/v1/service-requests/REQ-00001 \
            | tee /tmp/service-request-final.json

          grep -q '"status":"Closed"' /tmp/service-request-final.json
          grep -q 'CI internal fulfilment note' /tmp/service-request-final.json
          grep -q 'CI customer-visible update' /tmp/service-request-final.json
          grep -q 'CI fulfilment task completed' /tmp/service-request-final.json
          grep -q '"status":"Approved"' /tmp/service-request-final.json

          PGPASSWORD=hi5central-ci psql \
            -h 127.0.0.1 \
            -U hi5central \
            -d hi5central \
            -v ON_ERROR_STOP=1 \
            -c "SELECT reference, priority, status, one_off_cost, closed_at IS NOT NULL AS closed, operational_data->>'completionNotes' AS completion_notes FROM service_requests WHERE tenant_id = '00000000-0000-4000-8000-000000000101'::uuid AND reference = 'REQ-00001';" \
            | tee /tmp/service-request-db.txt

          grep -q 'REQ-00001' /tmp/service-request-db.txt
          grep -q 'High' /tmp/service-request-db.txt
          grep -q 'Closed' /tmp/service-request-db.txt
          grep -q '1399.00' /tmp/service-request-db.txt
          grep -q 'CI request fulfilment completed and verified' /tmp/service-request-db.txt
