name: Workspace Runtime Production Only

on:
  push:
    branches:
      - production-runtime-demo-cleanup
    paths:
      - .github/workflows/workspace-runtime-production-only.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-runtime-demo-cleanup

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Remove dead workspace surfaces
        run: python3 scripts/workspace-runtime-production-only.py

      - name: Verify production runtime boundary
        run: node scripts/check-production-runtime-boundary.mjs

      - name: Build production web
        run: npm run build

      - name: Publish production-only workspace runtime
        shell: bash
        run: |
          rm -f scripts/workspace-runtime-production-only.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/workspace-runtime-production-only.yml || true
          if git diff --cached --quiet; then
            echo "No source changes to publish."
            exit 0
          fi
          git commit -m "Make workspace runtime production-surface only"
          git push origin HEAD:production-runtime-demo-cleanup
