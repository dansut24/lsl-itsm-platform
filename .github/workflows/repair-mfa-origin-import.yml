name: Repair MFA deployment import

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-mfa-origin-import.mjs'
      - '.github/workflows/repair-mfa-origin-import.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair MFA module from exact source snapshot
        run: node scripts/repair-mfa-origin-import.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src/mfa.js
          git commit -m 'Restore MFA module with deployment-aware origin guard'
          git push origin HEAD:main
