services:
  postgres:
    image: postgres:17-alpine
    container_name: hi5self-postgres
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hi5self_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:8-alpine
    container_name: hi5self-redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - hi5self_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  migrate:
    image: postgres:17-alpine
    container_name: hi5self-migrate
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../../api/migrations:/migrations:ro
      - ../migrate.sh:/usr/local/bin/hi5-migrate:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/hi5-migrate"]
    networks: [internal]

  api:
    build:
      context: ../../../api
      dockerfile: Dockerfile
    container_name: hi5self-api
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE}
      TENANCY_MODE: ${TENANCY_MODE}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      PRIMARY_TENANT_SLUG: ${PRIMARY_TENANT_SLUG}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      PORTAL_URL: ${PORTAL_URL}
      RMM_URL: ${RMM_URL}
      MARKETING_URL: ${MARKETING_URL}
      DOWNLOADS_URL: ${DOWNLOADS_URL}
      TURN_URL: ${TURN_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      SELF_HOST_EVALUATION_PRODUCTS: ${SELF_HOST_EVALUATION_PRODUCTS}
      SELF_HOST_EVALUATION_USER_LIMIT: ${SELF_HOST_EVALUATION_USER_LIMIT}
      SELF_HOST_EVALUATION_DEVICE_LIMIT: ${SELF_HOST_EVALUATION_DEVICE_LIMIT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    networks: [internal]

  web:
    build:
      context: ../../..
      dockerfile: Dockerfile.production
    container_name: hi5self-web
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.75
    depends_on:
      api:
        condition: service_healthy
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE}
      TENANCY_MODE: ${TENANCY_MODE}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      PRIMARY_TENANT_SLUG: ${PRIMARY_TENANT_SLUG}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      PORTAL_URL: ${PORTAL_URL}
      RMM_URL: ${RMM_URL}
      MARKETING_URL: ${MARKETING_URL}
      DOWNLOADS_URL: ${DOWNLOADS_URL}
      TURN_URL: ${TURN_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      internal:
      public_proxy:
        aliases:
          - hi5self-web

networks:
  internal:
    name: hi5self_internal
    driver: bridge
  public_proxy:
    external: true
    name: hi5central

volumes:
  hi5self_postgres_data:
    name: hi5self_postgres_data
  hi5self_redis_data:
    name: hi5self_redis_data
